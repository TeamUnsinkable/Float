; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s2_reversetft]
platform = espressif32
board = adafruit_feather_esp32s2_reversetft
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DESP32_S2
lib_deps = 
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	fbiego/ESP32Time@^2.0.6
	marian-craciunescu/ESP32Ping@^1.7
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	janelia-arduino/TMC2209@^10.1.1
	adafruit/Adafruit GFX Library@^1.11.9
	arduino-libraries/LiquidCrystal@^1.0.7
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
	fortyseveneffects/MIDI Library@^5.0.2
	adafruit/Adafruit seesaw Library@^1.7.5
	adafruit/Adafruit Unified Sensor@^1.1.13
	pkerspe/ESP-FlexyStepper@^1.5.1
monitor_speed = 115200

[env:adafruit_feather_esp32s3_reversetft]
platform = espressif32
board = adafruit_feather_esp32s3_tft
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DESP32_S3
	-mfix-esp32-psram-cache-issue
lib_deps = 
	bluerobotics/BlueRobotics MS5837 Library@^1.1.1
	fbiego/ESP32Time@^2.0.6
	marian-craciunescu/ESP32Ping@^1.7
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	janelia-arduino/TMC2209@^10.1.1
	adafruit/Adafruit GFX Library@^1.11.9
	arduino-libraries/LiquidCrystal@^1.0.7
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
	fortyseveneffects/MIDI Library@^5.0.2
	adafruit/Adafruit seesaw Library@^1.7.5
	adafruit/Adafruit Unified Sensor@^1.1.13
	pkerspe/ESP-FlexyStepper@^1.5.1
monitor_speed = 115200